<svg xmlns="http://www.w3.org/2000/svg" width="280" height="520" viewBox="0 0 280 520">
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Panel Background -->
  <rect width="280" height="520" fill="#0a0a0a" opacity="0.97"/>

  <!-- Title -->
  <text x="18" y="34" font-size="22" font-weight="700" fill="#ffffff">MAC</text>
  <text x="72" y="34" font-size="22" font-weight="400" fill="#aaaaaa">UI</text>
  <text x="254" y="30" font-size="18" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Buttons -->
  <rect x="18" y="52" width="115" height="32" rx="2" fill="#ffffff"/>
  <text x="75" y="73" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">UNLOCK</text>
  <rect x="147" y="52" width="115" height="32" rx="2" fill="#ffffff"/>
  <text x="204" y="73" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">LOCK</text>

  <!-- Font Size -->
  <text x="18" y="108" font-size="10" fill="#888888">FONT SIZE:</text>
  <text x="88" y="108" font-size="10" font-weight="600" fill="#ffffff">14</text>
  <rect x="18" y="116" width="240" height="2" rx="1" fill="#444444"/>
  <circle cx="110" cy="117" r="5" fill="#ffffff"/>

  <!-- ════════════════════════════════════ -->
  <!-- SECTION 1: PLAYER STATS -->
  <!-- ════════════════════════════════════ -->
  <text x="18" y="148" font-size="10" font-weight="600" fill="#888888">PLAYER STATS</text>
  <rect x="18" y="155" width="240" height="1" fill="#333333"/>

  <!-- Health Row — simple toggle switch style -->
  <text x="18" y="178" font-size="11" fill="#ffffff">Health</text>
  <!-- Toggle: ON -->
  <rect x="218" y="166" width="36" height="18" rx="9" fill="#00cc44"/>
  <circle cx="241" cy="175" r="7" fill="#ffffff"/>

  <!-- Resource Row — shows class-specific resource -->
  <text x="18" y="204" font-size="11" fill="#ffffff">Rage</text>
  <text x="60" y="204" font-size="9" fill="#555555">(Resource)</text>
  <!-- Toggle: ON -->
  <rect x="218" y="192" width="36" height="18" rx="9" fill="#00cc44"/>
  <circle cx="241" cy="201" r="7" fill="#ffffff"/>

  <!-- Power Row — shows spec-specific power (if applicable) -->
  <text x="18" y="230" font-size="11" fill="#666666">—</text>
  <text x="30" y="230" font-size="9" fill="#444444">No secondary power for this spec</text>

  <!-- ════════════════════════════════════ -->
  <!-- SECTION 2: ABILITY TRACKING -->
  <!-- ════════════════════════════════════ -->
  <text x="18" y="264" font-size="10" font-weight="600" fill="#888888">ABILITY TRACKING</text>
  <rect x="18" y="271" width="240" height="1" fill="#333333"/>

  <!-- Ability Row 1: Shield Block -->
  <rect x="18" y="282" width="14" height="14" rx="1" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <text x="25" y="293" font-size="10" font-weight="700" fill="#000000">✓</text>
  <rect x="38" y="282" width="16" height="16" rx="2" fill="#4488cc"/>
  <text x="60" y="294" font-size="11" fill="#ffffff">Shield Block</text>
  <text x="155" y="294" font-size="10" fill="#ff5555">X</text>
  <rect x="240" y="282" width="16" height="16" rx="1" fill="#229922" stroke="#00ff00" stroke-width="1"/>
  <text x="248" y="294" font-size="10" font-weight="600" fill="#000000" text-anchor="middle">A</text>

  <!-- Ability Row 2: Ignore Pain -->
  <rect x="18" y="306" width="14" height="14" rx="1" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <text x="25" y="317" font-size="10" font-weight="700" fill="#000000">✓</text>
  <rect x="38" y="306" width="16" height="16" rx="2" fill="#cc8844"/>
  <text x="60" y="318" font-size="11" fill="#ffffff">Ignore Pain</text>
  <text x="145" y="318" font-size="10" fill="#ff5555">X</text>
  <rect x="240" y="306" width="16" height="16" rx="1" fill="#222222" stroke="#555555" stroke-width="1"/>
  <text x="248" y="318" font-size="10" font-weight="600" fill="#555555" text-anchor="middle">A</text>

  <!-- Smart Input Box -->
  <rect x="24" y="340" width="170" height="22" rx="1" fill="none" stroke="#555555" stroke-width="1"/>
  <text x="32" y="355" font-size="11" fill="#777777" font-style="italic">Shift-Click spell...</text>
  <rect x="200" y="340" width="22" height="22" rx="1" fill="#222222" stroke="#555555" stroke-width="1"/>
  <text x="211" y="356" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">+</text>

  <!-- Option Label -->
  <rect x="18" y="390" width="240" height="1" fill="#222222"/>
  <text x="140" y="410" font-size="10" font-weight="700" fill="#00cc44" text-anchor="middle">OPTION A — Toggle Switches</text>
  <text x="140" y="425" font-size="9" fill="#555555" text-anchor="middle">Clean iOS-style toggles for Player Stats.</text>
  <text x="140" y="440" font-size="9" fill="#555555" text-anchor="middle">Existing checkbox style for Ability Tracking.</text>
  <text x="140" y="455" font-size="9" fill="#555555" text-anchor="middle">Inactive power row shows "—" gracefully.</text>
</svg>
