<svg xmlns="http://www.w3.org/2000/svg" width="280" height="520" viewBox="0 0 280 520">
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Panel Background -->
  <rect width="280" height="520" fill="#0a0a0a" opacity="0.97"/>

  <!-- Title -->
  <text x="18" y="34" font-size="22" font-weight="700" fill="#ffffff">MAC</text>
  <text x="72" y="34" font-size="22" font-weight="400" fill="#aaaaaa">UI</text>
  <text x="254" y="30" font-size="18" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Buttons -->
  <rect x="18" y="52" width="115" height="32" rx="2" fill="#ffffff"/>
  <text x="75" y="73" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">UNLOCK</text>
  <rect x="147" y="52" width="115" height="32" rx="2" fill="#ffffff"/>
  <text x="204" y="73" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">LOCK</text>

  <!-- Font Size -->
  <text x="18" y="108" font-size="10" fill="#888888">FONT SIZE:</text>
  <text x="88" y="108" font-size="10" font-weight="600" fill="#ffffff">14</text>
  <rect x="18" y="116" width="240" height="2" rx="1" fill="#444444"/>
  <circle cx="110" cy="117" r="5" fill="#ffffff"/>

  <!-- ════════════════════════════════════ -->
  <!-- SECTION 1: PLAYER STATS — Inline compact -->
  <!-- ════════════════════════════════════ -->
  <text x="18" y="148" font-size="10" font-weight="600" fill="#888888">PLAYER STATS</text>
  <rect x="18" y="155" width="240" height="1" fill="#333333"/>

  <!-- 3 compact square tiles in a row -->
  <!-- HEALTH tile (enabled) -->
  <rect x="18" y="165" width="74" height="50" rx="2" fill="#111111" stroke="#00ff00" stroke-width="1"/>
  <text x="55" y="185" font-size="9" font-weight="600" fill="#00ff00" text-anchor="middle">HEALTH</text>
  <text x="55" y="205" font-size="8" fill="#555555" text-anchor="middle">HP %</text>

  <!-- RAGE tile (enabled) -->
  <rect x="100" y="165" width="74" height="50" rx="2" fill="#111111" stroke="#ff0000" stroke-width="1"/>
  <text x="137" y="185" font-size="9" font-weight="600" fill="#ff0000" text-anchor="middle">RAGE</text>
  <text x="137" y="205" font-size="8" fill="#555555" text-anchor="middle">Resource</text>

  <!-- POWER tile (N/A — dimmed, no border color) -->
  <rect x="182" y="165" width="76" height="50" rx="2" fill="#0a0a0a" stroke="#222222" stroke-width="1"/>
  <text x="220" y="185" font-size="9" font-weight="600" fill="#333333" text-anchor="middle">POWER</text>
  <text x="220" y="205" font-size="8" fill="#222222" text-anchor="middle">N/A</text>

  <!-- Tap-to-toggle hint -->
  <text x="18" y="230" font-size="8" fill="#444444">Click tile to toggle on/off</text>

  <!-- ════════════════════════════════════ -->
  <!-- SECTION 2: ABILITY TRACKING -->
  <!-- ════════════════════════════════════ -->
  <text x="18" y="256" font-size="10" font-weight="600" fill="#888888">ABILITY TRACKING</text>
  <rect x="18" y="263" width="240" height="1" fill="#333333"/>

  <!-- Ability Row 1 -->
  <rect x="18" y="274" width="14" height="14" rx="1" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <text x="25" y="285" font-size="10" font-weight="700" fill="#000000">✓</text>
  <rect x="38" y="274" width="16" height="16" rx="2" fill="#4488cc"/>
  <text x="60" y="286" font-size="11" fill="#ffffff">Shield Block</text>
  <text x="155" y="286" font-size="10" fill="#ff5555">X</text>
  <rect x="240" y="274" width="16" height="16" rx="1" fill="#229922" stroke="#00ff00" stroke-width="1"/>
  <text x="248" y="286" font-size="10" font-weight="600" fill="#000000" text-anchor="middle">A</text>

  <!-- Ability Row 2 -->
  <rect x="18" y="298" width="14" height="14" rx="1" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <text x="25" y="309" font-size="10" font-weight="700" fill="#000000">✓</text>
  <rect x="38" y="298" width="16" height="16" rx="2" fill="#cc8844"/>
  <text x="60" y="310" font-size="11" fill="#ffffff">Ignore Pain</text>
  <text x="145" y="310" font-size="10" fill="#ff5555">X</text>
  <rect x="240" y="298" width="16" height="16" rx="1" fill="#222222" stroke="#555555" stroke-width="1"/>
  <text x="248" y="310" font-size="10" font-weight="600" fill="#555555" text-anchor="middle">A</text>

  <!-- Input -->
  <rect x="24" y="330" width="170" height="22" rx="1" fill="none" stroke="#555555" stroke-width="1"/>
  <text x="32" y="345" font-size="11" fill="#777777" font-style="italic">Shift-Click spell...</text>
  <rect x="200" y="330" width="22" height="22" rx="1" fill="#222222" stroke="#555555" stroke-width="1"/>
  <text x="211" y="346" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">+</text>

  <!-- Option Label -->
  <rect x="18" y="390" width="240" height="1" fill="#222222"/>
  <text x="140" y="410" font-size="10" font-weight="700" fill="#00cc44" text-anchor="middle">OPTION C — Grid Tiles</text>
  <text x="140" y="425" font-size="9" fill="#555555" text-anchor="middle">3 compact tiles in a row — tap to toggle.</text>
  <text x="140" y="440" font-size="9" fill="#555555" text-anchor="middle">Colored borders match in-game resource color.</text>
  <text x="140" y="455" font-size="9" fill="#555555" text-anchor="middle">Unavailable power is dimmed but present.</text>
  <text x="140" y="470" font-size="9" fill="#555555" text-anchor="middle">Most compact — saves vertical space.</text>
</svg>
