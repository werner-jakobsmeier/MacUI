<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" width="720" height="1160">
  <defs><style>text { font-family: Arial, sans-serif; }</style></defs>

  <!-- Window: 320x560 at (20,20) → inner content x=40..300, width=280 -->
  <rect x="20" y="20" width="320" height="560" fill="#0F172A" stroke="#D1D5DB" stroke-width="2"/>
  <text x="180" y="14" font-size="10" fill="#9CA3AF" text-anchor="middle">PROPOSED v3 — no dividers, equal margins, full-width desc</text>

  <!-- ── Title: y=20+14=34 baseline (26pt ≈ 22px cap height) -->
  <text x="40" y="50" font-size="22" font-weight="bold" fill="#D1D5DB">Mac</text>
  <text x="88" y="50" font-size="16" fill="#6B7280">UI</text>

  <!-- ── Buttons: flush to right, right edge at x=300 (20px padding)
       CLOSE  48px: x=252..300 → TOPRIGHT -20
       RELOAD 48px: x=200..248 → TOPRIGHT -72
       LOCK   58px: x=138..196 → TOPRIGHT -134
  -->
  <rect x="138" y="33" width="58" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="167" y="44" font-size="8" fill="#D1D5DB" text-anchor="middle">LOCKED</text>

  <rect x="200" y="33" width="48" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="224" y="44" font-size="8" fill="#D1D5DB" text-anchor="middle">RELOAD</text>

  <rect x="252" y="33" width="48" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="276" y="44" font-size="8" fill="#D1D5DB" text-anchor="middle">CLOSE</text>

  <!-- ── Desc text: x=40, width=260, no divider above/below
       At ~9pt (~12px line height) this wraps at ~260px → 3 lines ending ~y=106 -->
  <text x="40" y="68" font-size="9" fill="#CBD5E1">Minimalist combat tracking for critical player stats, resources,</text>
  <text x="40" y="80" font-size="9" fill="#CBD5E1">and active defensive abilities. Health and mana percentages</text>
  <text x="40" y="92" font-size="9" fill="#CBD5E1">are restricted by Blizzard security policy.</text>

  <!-- ── Stat tiles: y=108, height=48, 3 tiles equal at 88px w/ 8px gap
       tile1 x=40, tile2 x=136, tile3 x=232 → right edge=320 ✓ -->
  <rect x="40" y="108" width="88" height="48" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="84" y="126" font-size="7" fill="#6B7280" text-anchor="middle">Health</text>
  <text x="84" y="143" font-size="9" font-weight="bold" fill="#4ADE80" text-anchor="middle">HEALTH</text>

  <rect x="136" y="108" width="88" height="48" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="180" y="126" font-size="7" fill="#6B7280" text-anchor="middle">Resource</text>
  <text x="180" y="143" font-size="9" font-weight="bold" fill="#D1D5DB" text-anchor="middle">MANA</text>

  <rect x="232" y="108" width="88" height="48" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="276" y="126" font-size="7" fill="#6B7280" text-anchor="middle">Power</text>
  <text x="276" y="143" font-size="9" font-weight="bold" fill="#D1D5DB" text-anchor="middle">POWER</text>

  <!-- ── Active Mitigation: y=168 (16px gap after tiles) -->
  <text x="40" y="175" font-size="11" font-weight="bold" fill="#E2E8F0">Active Mitigation</text>

  <rect x="40" y="181" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="189" width="22" height="22" fill="#8080FF"/>
  <text x="78" y="202" font-size="11" font-weight="bold" fill="#FFF">SotR Buff</text>
  <text x="78" y="215" font-size="8" fill="#64748B">SOUND: None</text>
  <rect x="280" y="191" width="36" height="16" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="298" y="203" font-size="7" fill="#6B7280" text-anchor="middle">AUDIO</text>

  <rect x="40" y="225" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="233" width="22" height="22" fill="#F59E0B"/>
  <text x="78" y="246" font-size="11" font-weight="bold" fill="#FFF">Cons Duration</text>
  <text x="78" y="259" font-size="8" fill="#64748B">SOUND: None</text>
  <rect x="280" y="235" width="36" height="16" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="298" y="247" font-size="7" fill="#6B7280" text-anchor="middle">AUDIO</text>

  <!-- ── Defensive Cooldowns: y=277 (12px gap) -->
  <text x="40" y="284" font-size="11" font-weight="bold" fill="#E2E8F0">Defensive Cooldowns</text>

  <rect x="40" y="290" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="298" width="22" height="22" fill="#3B82F6"/>
  <text x="78" y="311" font-size="11" font-weight="bold" fill="#FFF">Guardian of Ancient Kings</text>
  <text x="78" y="324" font-size="8" fill="#64748B">SOUND: None</text>
  <rect x="280" y="300" width="36" height="16" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="298" y="312" font-size="7" fill="#6B7280" text-anchor="middle">AUDIO</text>

  <rect x="40" y="334" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="342" width="22" height="22" fill="#EF4444"/>
  <text x="78" y="355" font-size="11" font-weight="bold" fill="#FFF">Ardent Defender</text>
  <text x="78" y="368" font-size="8" fill="#64748B">SOUND: None</text>
  <rect x="280" y="344" width="36" height="16" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="298" y="356" font-size="7" fill="#6B7280" text-anchor="middle">AUDIO</text>

  <rect x="40" y="378" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="386" width="22" height="22" fill="#A855F7"/>
  <text x="78" y="399" font-size="11" font-weight="bold" fill="#FFF">Eye of Tyr</text>
  <text x="78" y="412" font-size="8" fill="#64748B">SOUND: None</text>
  <rect x="280" y="388" width="36" height="16" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="298" y="400" font-size="7" fill="#6B7280" text-anchor="middle">AUDIO</text>

  <!-- Bottom padding breathing room y=418..580 -->
  <text x="40" y="448" font-size="8" fill="#4ADE80">✓ No dividers — clean, pure brutalism</text>
  <text x="40" y="460" font-size="8" fill="#4ADE80">✓ Buttons flush right at 20px (matching left margin)</text>
  <text x="40" y="472" font-size="8" fill="#4ADE80">✓ Desc text uses full 280px content width</text>
  <text x="40" y="484" font-size="8" fill="#4ADE80">✓ Stat tiles span full 280px (88px × 3 + 8px gaps × 2)</text>
  <text x="40" y="496" font-size="8" fill="#4ADE80">✓ Consistent 12–16px section gaps throughout</text>
</svg>
