<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#1a1a1a"/>
  
  <!-- Dim background -->
  <rect width="800" height="600" fill="#000" opacity="0.5"/>
  
  <!-- Config Panel -->
  <g transform="translate(270, 120)">
    <rect width="260" height="360" fill="#050505" stroke="#333" stroke-width="1"/>
    
    <!-- Title -->
    <text x="20" y="30" font-family="monospace" font-size="24" fill="#33FF99" font-weight="bold">MacUI</text>
    
    <!-- UNLOCK Button -->
    <rect x="170" y="15" width="70" height="20" fill="#111" stroke="#444" stroke-width="1"/>
    <text x="205" y="29" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">UNLOCK</text>
    <line x1="20" y1="45" x2="240" y2="45" stroke="#333" stroke-width="1"/>
    
    <!-- PLAYER STATS -->
    <text x="20" y="70" font-family="monospace" font-size="10" fill="#888">PLAYER STATS</text>
    <line x1="20" y1="80" x2="240" y2="80" stroke="#333" stroke-width="1"/>
    
    <!-- Tile 1: Health -->
    <rect x="20" y="90" width="70" height="40" fill="#111" stroke="#00FF00" stroke-width="2"/>
    <text x="55" y="108" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">Health</text>
    <text x="55" y="122" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Universal</text>
    
    <!-- Tile 2: Rage -->
    <rect x="95" y="90" width="70" height="40" fill="#111" stroke="#FF0000" stroke-width="2"/>
    <text x="130" y="108" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">Rage</text>
    <text x="130" y="122" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Resource</text>
    
    <!-- Tile 3: N/A -->
    <rect x="170" y="90" width="70" height="40" fill="#0a0a0a" stroke="#222" stroke-width="1"/>
    <text x="205" y="115" font-family="monospace" font-size="10" fill="#444" text-anchor="middle">N/A</text>
    
    <!-- ABILITY TRACKING -->
    <text x="20" y="160" font-family="monospace" font-size="10" fill="#888">ABILITY TRACKING</text>
    <line x1="20" y1="170" x2="240" y2="170" stroke="#333" stroke-width="1"/>
    
    <!-- Tracked Ability 1: Shield Block -->
    <g transform="translate(20, 185)">
      <!-- Checkbox -->
      <rect x="0" y="0" width="14" height="14" fill="#000" stroke="#fff" stroke-width="1"/>
      <text x="7" y="12" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle">✓</text>
      <!-- Icon Preview -->
      <rect x="20" y="-1" width="16" height="16" fill="#333"/>
      <!-- Label -->
      <text x="45" y="11" font-family="monospace" font-size="10" fill="#fff">Shield Block</text>
      <!-- Delete Button -->
      <rect x="130" y="-2" width="18" height="18" fill="#111" stroke="#444" stroke-width="1"/>
      <text x="139" y="11" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle">X</text>
      <!-- Audio Dropdown Trigger -->
      <rect x="155" y="-2" width="85" height="18" fill="#111" stroke="#444" stroke-width="1"/>
      <text x="160" y="11" font-family="monospace" font-size="10" fill="#fff">Warning</text>
      <path d="M 230 7 L 235 7 L 232.5 12 Z" fill="#888"/>
    </g>
    
    <!-- Tracked Ability 2: Ignore Pain -->
    <g transform="translate(20, 209)">
      <!-- Checkbox -->
      <rect x="0" y="0" width="14" height="14" fill="#000" stroke="#fff" stroke-width="1"/>
      <text x="7" y="12" font-family="monospace" font-size="12" fill="#fff" text-anchor="middle">✓</text>
      <!-- Icon Preview -->
      <rect x="20" y="-1" width="16" height="16" fill="#333"/>
      <!-- Label -->
      <text x="45" y="11" font-family="monospace" font-size="10" fill="#fff">Ignore Pain</text>
      <!-- Delete Button -->
      <rect x="130" y="-2" width="18" height="18" fill="#111" stroke="#444" stroke-width="1"/>
      <text x="139" y="11" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle">X</text>
      <!-- Audio Dropdown Trigger -->
      <rect x="155" y="-2" width="85" height="18" fill="#111" stroke="#444" stroke-width="1"/>
      <text x="160" y="11" font-family="monospace" font-size="10" fill="#555">None</text>
      <path d="M 230 7 L 235 7 L 232.5 12 Z" fill="#888"/>
    </g>
    
    <!-- Input Box -->
    <rect x="20" y="240" width="220" height="25" fill="#111" stroke="#444" stroke-width="1"/>
    <text x="30" y="256" font-family="monospace" font-size="10" fill="#555">[Shift-Click Spell Here...]</text>
    
    <!-- Reload -->
    <rect x="20" y="325" width="220" height="20" fill="#111" stroke="#33FF99" stroke-width="1"/>
    <text x="130" y="339" font-family="monospace" font-size="10" fill="#33FF99" text-anchor="middle">RELOAD UI TO APPLY</text>
  </g>
</svg>
