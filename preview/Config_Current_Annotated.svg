<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="720" height="1200">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
    </style>
  </defs>

  <!-- ===== CURRENT LAYOUT (LEFT PANEL) ===== -->
  <!-- Window -->
  <rect x="20" y="20" width="320" height="560" fill="#0F172A" stroke="#D1D5DB" stroke-width="2"/>

  <!-- LABEL -->
  <text x="180" y="14" font-size="10" fill="#6B7280" text-anchor="middle">CURRENT</text>

  <!-- Title -->
  <text x="40" y="52" font-size="22" font-weight="bold" fill="#D1D5DB">Mac</text>
  <text x="88" y="52" font-size="16" fill="#6B7280">UI</text>

  <!-- Top-right buttons -->
  <rect x="178" y="34" width="46" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="201" y="45" font-size="8" fill="#D1D5DB" text-anchor="middle">LOCKED</text>
  <rect x="228" y="34" width="40" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="248" y="45" font-size="8" fill="#D1D5DB" text-anchor="middle">RELOAD</text>
  <rect x="272" y="34" width="40" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="292" y="45" font-size="8" fill="#D1D5DB" text-anchor="middle">CLOSE</text>

  <!-- Desc text block (starts at y=68, 4 lines at 14px line-height = ends at ~124) -->
  <rect x="40" y="68" width="280" height="54" fill="#1E3A5F" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="42" y="80" font-size="8" fill="#94A3B8">Minimalist combat tracking for critical player</text>
  <text x="42" y="90" font-size="8" fill="#94A3B8">stats, resources, and active defensive</text>
  <text x="42" y="100" font-size="8" fill="#94A3B8">abilities. Health and mana percentages are</text>
  <text x="42" y="110" font-size="8" fill="#94A3B8">restricted by Blizzard security policy.</text>
  <!-- Problem label -->
  <text x="325" y="88" font-size="8" fill="#EF4444">⚠</text>
  <text x="325" y="98" font-size="6" fill="#EF4444">OVERLAP</text>

  <!-- Stat tiles: x=20+0=40, x=20+90=110+20=130, x=20+180=200+20=220 on panel — at y=84+20=104 (panel y+84=24+84=108) -->
  <!-- Tiles start at panel y=84, but desc text is still going at y=110 → OVERLAP -->
  <rect x="40" y="104" width="80" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="80" y="120" font-size="7" fill="#6B7280" text-anchor="middle">Health</text>
  <text x="80" y="134" font-size="8" fill="#4ADE80" text-anchor="middle">HEALTH</text>

  <rect x="130" y="104" width="80" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="170" y="120" font-size="7" fill="#6B7280" text-anchor="middle">Resource</text>
  <text x="170" y="134" font-size="8" fill="#D1D5DB" text-anchor="middle">MANA</text>

  <rect x="220" y="104" width="80" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="260" y="120" font-size="7" fill="#6B7280" text-anchor="middle">Power</text>
  <text x="260" y="134" font-size="8" fill="#D1D5DB" text-anchor="middle">POWER</text>

  <!-- Gap annotation -->
  <line x1="315" y1="144" x2="315" y2="200" stroke="#6B7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="318" y="175" font-size="7" fill="#6B7280" transform="rotate(90,318,175)">56px</text>

  <!-- Active Mitigation header at y=200 (panel y=180) -->
  <text x="40" y="198" font-size="11" font-weight="bold" fill="#E2E8F0">Active Mitigation</text>

  <!-- Row 1 -->
  <rect x="40" y="204" width="280" height="44" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="212" width="24" height="24" fill="#8080FF"/>
  <text x="80" y="225" font-size="11" font-weight="bold" fill="#FFF">SotR Buff</text>
  <text x="80" y="238" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- Row 2 -->
  <rect x="40" y="252" width="280" height="44" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="260" width="24" height="24" fill="#F59E0B"/>
  <text x="80" y="273" font-size="11" font-weight="bold" fill="#FFF">Cons Duration</text>
  <text x="80" y="286" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- Defensive Cooldowns header -->
  <text x="40" y="316" font-size="11" font-weight="bold" fill="#E2E8F0">Defensive Cooldowns</text>

  <!-- CD Row 1 -->
  <rect x="40" y="322" width="280" height="44" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="330" width="24" height="24" fill="#3B82F6"/>
  <text x="80" y="343" font-size="11" font-weight="bold" fill="#FFF">Guardian of Ancient Kings</text>
  <text x="80" y="356" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- CD Row 2 -->
  <rect x="40" y="370" width="280" height="44" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="378" width="24" height="24" fill="#EF4444"/>
  <text x="80" y="391" font-size="11" font-weight="bold" fill="#FFF">Ardent Defender</text>
  <text x="80" y="404" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- CD Row 3 -->
  <rect x="40" y="418" width="280" height="44" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="426" width="24" height="24" fill="#A855F7"/>
  <text x="80" y="439" font-size="11" font-weight="bold" fill="#FFF">Eye of Tyr</text>
  <text x="80" y="452" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- CURRENT issues callout -->
  <text x="40" y="490" font-size="8" fill="#EF4444">✗ Tiles not full-width (260px used of 280)</text>
  <text x="40" y="502" font-size="8" fill="#EF4444">✗ Desc text overflows into stat tiles</text>
  <text x="40" y="514" font-size="8" fill="#EF4444">✗ Too little gap between tiles and sections</text>
  <text x="40" y="526" font-size="8" fill="#EF4444">✗ Large empty area at bottom</text>
</svg>
