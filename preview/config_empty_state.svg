<svg xmlns="http://www.w3.org/2000/svg" width="280" height="340" viewBox="0 0 280 340">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Panel Background -->
  <rect width="280" height="340" rx="0" fill="#0a0a0a" opacity="0.97"/>

  <!-- Title: MAC (bold) + UI (thin) -->
  <text x="18" y="34" font-size="22" font-weight="700" fill="#ffffff">MAC</text>
  <text x="72" y="34" font-size="22" font-weight="400" fill="#aaaaaa">UI</text>

  <!-- Close Button -->
  <text x="254" y="30" font-size="18" fill="#ffffff" text-anchor="middle">×</text>

  <!-- UNLOCK / LOCK Buttons -->
  <rect x="18" y="52" width="115" height="32" rx="2" fill="#ffffff"/>
  <text x="75" y="73" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">UNLOCK</text>
  <rect x="147" y="52" width="115" height="32" rx="2" fill="#ffffff"/>
  <text x="204" y="73" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">LOCK</text>

  <!-- Font Size Section -->
  <text x="18" y="108" font-size="10" fill="#888888">FONT SIZE:</text>
  <text x="88" y="108" font-size="10" font-weight="600" fill="#ffffff">14</text>
  <!-- Slider Track -->
  <rect x="18" y="116" width="240" height="2" rx="1" fill="#444444"/>
  <!-- Slider Thumb -->
  <circle cx="110" cy="117" r="5" fill="#ffffff"/>

  <!-- Abilities Section -->
  <text x="18" y="148" font-size="10" fill="#888888">ABILITIES</text>
  <rect x="18" y="155" width="240" height="1" fill="#333333"/>

  <!-- Empty State Message -->
  <text x="18" y="178" font-size="10" fill="#666666">You are not tracking any abilities.</text>
  <text x="18" y="193" font-size="10" fill="#666666">Shift-Click a spell from your spellbook</text>
  <text x="18" y="208" font-size="10" fill="#666666">below to get started.</text>

  <!-- Smart Input Box -->
  <rect x="24" y="222" width="170" height="22" rx="1" fill="none" stroke="#555555" stroke-width="1"/>
  <text x="32" y="237" font-size="11" fill="#777777" font-style="italic">Shift-Click spell...</text>
  <!-- Add Button -->
  <rect x="200" y="222" width="22" height="22" rx="1" fill="#222222" stroke="#555555" stroke-width="1"/>
  <text x="211" y="238" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">+</text>

  <!-- Footer Label -->
  <text x="140" y="320" font-size="8" fill="#333333" text-anchor="middle">MacUI v1.0 — /macui</text>
</svg>
