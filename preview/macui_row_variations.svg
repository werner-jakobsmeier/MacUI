<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#0F172A"/>

  <!-- VARIATION A: WIDE SINGLE-ROW (High Density) -->
  <text x="20" y="30" font-family="Arial Narrow" font-size="14" fill="#D1D5DB" font-weight="bold">Variation A: Wide Single-Row</text>
  <rect x="20" y="45" width="260" height="24" stroke="#6B7280" fill="#1E293B"/>
  <rect x="24" y="51" width="12" height="12" stroke="#D1D5DB" fill="none"/>
  <text x="30" y="60" font-family="Arial Narrow" font-size="10" fill="#D1D5DB" text-anchor="middle">X</text>
  <rect x="42" y="49" width="16" height="16" fill="#020617"/> <!-- Icon Placeholder -->
  <text x="64" y="61" font-family="Arial Narrow" font-size="12" fill="#D1D5DB">Shield Block</text>
  <!-- Sound Name surfaces next to icon -->
  <text x="180" y="61" font-family="Arial Narrow" font-size="9" fill="#6B7280" text-anchor="end">Raid Warning</text>
  <rect x="238" y="49" width="16" height="16" stroke="#D1D5DB" fill="#1E293B"/>
  <text x="246" y="61" font-family="Arial Narrow" font-size="10" fill="#D1D5DB" text-anchor="middle">A</text>

  <!-- VARIATION B: BRUTALIST STACK (Double Row) -->
  <text x="20" y="120" font-family="Arial Narrow" font-size="14" fill="#D1D5DB" font-weight="bold">Variation B: Brutalist Stack (Recommended)</text>
  <rect x="20" y="135" width="260" height="36" stroke="#6B7280" fill="#1E293B"/>
  <rect x="24" y="141" width="12" height="12" stroke="#D1D5DB" fill="none"/>
  <text x="30" y="150" font-family="Arial Narrow" font-size="10" fill="#D1D5DB" text-anchor="middle">X</text>
  <rect x="42" y="139" width="16" height="16" fill="#020617"/>
  <text x="64" y="152" font-family="Arial Narrow" font-size="12" fill="#D1D5DB">Shield Block</text>
  <!-- Second line for Metadata -->
  <text x="64" y="165" font-family="Arial Narrow" font-size="9" fill="#6B7280">SOUND: Raid Warning</text>
  <rect x="238" y="145" width="22" height="16" stroke="#D1D5DB" fill="#1E293B"/>
  <text x="249" y="157" font-family="Arial Narrow" font-size="9" fill="#D1D5DB" text-anchor="middle">AUDIO</text>

  <!-- VARIATION C: METADATA COLUMN -->
  <text x="20" y="230" font-family="Arial Narrow" font-size="14" fill="#D1D5DB" font-weight="bold">Variation C: Metadata Column</text>
  <rect x="20" y="245" width="260" height="24" stroke="#6B7280" fill="#1E293B"/>
  <rect x="24" y="251" width="12" height="12" stroke="#D1D5DB" fill="none"/>
  <text x="64" y="261" font-family="Arial Narrow" font-size="12" fill="#D1D5DB">Shield Block</text>
  <!-- Clean break for Audio -->
  <rect x="200" y="249" width="76" height="16" stroke="#6B7280" fill="#0F172A"/>
  <text x="204" y="261" font-family="Arial Narrow" font-size="8" fill="#6B7280">SOUND:</text>
  <text x="260" y="261" font-family="Arial Narrow" font-size="8" fill="#D1D5DB" text-anchor="end">Raid Warning</text>
  
  <!-- Visual Guides -->
  <line x1="280" y1="0" x2="280" y2="400" stroke="#00FF00" stroke-dasharray="4,4" opacity="0.3"/>
  <text x="285" y="390" font-family="Arial Narrow" font-size="8" fill="#00FF00">Right Margin (20px)</text>
</svg>
