<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="720" height="1200">
  <defs>
    <style>text { font-family: Arial, sans-serif; }</style>
  </defs>

  <!-- ===== PROPOSED LAYOUT ===== -->
  <!-- Window: 320x560 -->
  <rect x="20" y="20" width="320" height="560" fill="#0F172A" stroke="#D1D5DB" stroke-width="2"/>
  <text x="180" y="14" font-size="10" fill="#6B7280" text-anchor="middle">PROPOSED</text>

  <!-- ── Title row: y=20 → y=50 (30px) -->
  <text x="40" y="50" font-size="22" font-weight="bold" fill="#D1D5DB">Mac</text>
  <text x="88" y="50" font-size="16" fill="#6B7280">UI</text>

  <!-- Buttons: flush right, same row -->
  <rect x="178" y="33" width="46" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="201" y="44" font-size="8" fill="#D1D5DB" text-anchor="middle">LOCKED</text>
  <rect x="228" y="33" width="40" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="248" y="44" font-size="8" fill="#D1D5DB" text-anchor="middle">RELOAD</text>
  <rect x="272" y="33" width="40" height="14" fill="none" stroke="#6B7280" stroke-width="1"/>
  <text x="292" y="44" font-size="8" fill="#D1D5DB" text-anchor="middle">CLOSE</text>

  <!-- ── Separator line: y=55 -->
  <line x1="40" y1="58" x2="320" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- ── Desc text: y=64 → ~y=100 (3 lines at 12pt) -->
  <text x="40" y="74" font-size="9" fill="#CBD5E1">Minimalist combat tracking for critical player stats,</text>
  <text x="40" y="86" font-size="9" fill="#CBD5E1">resources, and active defensive abilities. Health and</text>
  <text x="40" y="98" font-size="9" fill="#CBD5E1">mana percentages are restricted by Blizzard policy.</text>

  <!-- ── Separator line: y=108 -->
  <line x1="40" y1="108" x2="320" y2="108" stroke="#334155" stroke-width="1"/>

  <!-- ── Stat tiles: y=116 → y=164 (48px tall), 3 tiles full-width
       Panel inner width = 280px (20px each side).
       3 tiles with 8px gap: (280 - 16) / 3 = 88px each
       x positions: 40, 140, 228  ... actually:
       tileW=88, gap=8, startX=40
       tile1: x=40  tile2: x=40+88+8=136  tile3: x=40+176+16=232 -->
  <rect x="40" y="116" width="88" height="48" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="84" y="134" font-size="7" fill="#6B7280" text-anchor="middle">Health</text>
  <text x="84" y="150" font-size="9" font-weight="bold" fill="#4ADE80" text-anchor="middle">HEALTH</text>

  <rect x="136" y="116" width="88" height="48" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="180" y="134" font-size="7" fill="#6B7280" text-anchor="middle">Resource</text>
  <text x="180" y="150" font-size="9" font-weight="bold" fill="#D1D5DB" text-anchor="middle">MANA</text>

  <rect x="232" y="116" width="88" height="48" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <text x="276" y="134" font-size="7" fill="#6B7280" text-anchor="middle">Power</text>
  <text x="276" y="150" font-size="9" font-weight="bold" fill="#D1D5DB" text-anchor="middle">POWER</text>

  <!-- ── Section gap: y=164+16=180, header at y=184 -->

  <!-- Active Mitigation header -->
  <text x="40" y="184" font-size="11" font-weight="bold" fill="#E2E8F0">Active Mitigation</text>

  <!-- AM Row 1: y=192 → y=232 -->
  <rect x="40" y="192" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="200" width="22" height="22" fill="#8080FF"/>
  <text x="78" y="213" font-size="11" font-weight="bold" fill="#FFF">SotR Buff</text>
  <text x="78" y="226" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- AM Row 2: y=236 → y=276 -->
  <rect x="40" y="236" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="244" width="22" height="22" fill="#F59E0B"/>
  <text x="78" y="257" font-size="11" font-weight="bold" fill="#FFF">Cons Duration</text>
  <text x="78" y="270" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- Section gap: y=276+16=292, header at y=296 -->

  <!-- Defensive Cooldowns header -->
  <text x="40" y="296" font-size="11" font-weight="bold" fill="#E2E8F0">Defensive Cooldowns</text>

  <!-- CD Row 1: y=304 -->
  <rect x="40" y="304" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="312" width="22" height="22" fill="#3B82F6"/>
  <text x="78" y="325" font-size="11" font-weight="bold" fill="#FFF">Guardian of Ancient Kings</text>
  <text x="78" y="338" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- CD Row 2: y=348 -->
  <rect x="40" y="348" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="356" width="22" height="22" fill="#EF4444"/>
  <text x="78" y="369" font-size="11" font-weight="bold" fill="#FFF">Ardent Defender</text>
  <text x="78" y="382" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- CD Row 3: y=392 -->
  <rect x="40" y="392" width="280" height="40" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <rect x="48" y="400" width="22" height="22" fill="#A855F7"/>
  <text x="78" y="413" font-size="11" font-weight="bold" fill="#FFF">Eye of Tyr</text>
  <text x="78" y="426" font-size="8" fill="#64748B">SOUND: None</text>

  <!-- Bottom area: y=432 → y=580 (148px breathing room) -->

  <!-- Proposed improvements callout -->
  <text x="40" y="460" font-size="8" fill="#4ADE80">✓ Tiles equal-width (88px) spanning full 280px inner width</text>
  <text x="40" y="472" font-size="8" fill="#4ADE80">✓ Separator lines replace dead space between zones</text>
  <text x="40" y="484" font-size="8" fill="#4ADE80">✓ Desc text properly clears stat tiles</text>
  <text x="40" y="496" font-size="8" fill="#4ADE80">✓ Consistent 16px gap between sections</text>
  <text x="40" y="508" font-size="8" fill="#4ADE80">✓ Rows slightly tighter (40px) for better content density</text>
</svg>
