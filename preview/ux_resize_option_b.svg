<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Inter', sans-serif; }
    </style>
  </defs>

  <rect width="300" height="200" fill="#1a1a2e"/>

  <!-- Unlocked Frame -->
  <g transform="translate(40, 50)">
    <!-- Base text that is being moved -->
    <text x="110" y="55" font-size="24" font-weight="600" fill="#ff0000" text-anchor="middle">Rage: 45</text>
    
    <!-- The Drag Overlay (Active during UNLOCK) -->
    <rect width="220" height="90" fill="#00ff00" opacity="0.2" stroke="#00ff00" stroke-width="2"/>
    <text x="110" y="25" font-size="10" font-weight="700" fill="#00ff00" text-anchor="middle">MacUIWarriorRage</text>
    <text x="110" y="40" font-size="9" fill="#aaffaa" text-anchor="middle">Left-Click &amp; Drag to Move</text>

    <!-- The Resize Controls (Attached to the bottom right of the overlay) -->
    <g transform="translate(160, 90)">
      <rect x="0" y="0" width="60" height="20" rx="2" fill="#222222" stroke="#555555" stroke-width="1"/>
      <!-- Minus Button -->
      <rect x="0" y="0" width="30" height="20" rx="2" fill="#222222"/>
      <text x="15" y="14" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">-</text>
      <!-- Divider -->
      <rect x="30" y="0" width="1" height="20" fill="#555555"/>
      <!-- Plus Button -->
      <rect x="31" y="0" width="29" height="20" rx="2" fill="#222222"/>
      <text x="45" y="14" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
    </g>
  </g>

  <text x="150" y="180" font-size="11" font-weight="600" fill="#8888aa" text-anchor="middle">OPTION B: On-Frame Control Nodes</text>
</svg>
