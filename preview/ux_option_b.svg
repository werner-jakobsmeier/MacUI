<svg width="300" height="360" viewBox="0 0 300 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="360" fill="#050505"/>
  <rect x="0.5" y="0.5" width="299" height="359" stroke="#222222"/>
  
  <text x="16" y="28" fill="white" font-family="Arial Narrow" font-size="16" font-weight="bold">MACUI</text>
  
  <!-- Top Right Text Buttons (No box) -->
  <text x="210" y="27" fill="white" font-family="Arial Narrow" font-size="9" text-anchor="middle">RELOAD</text>
  <line x1="195" y1="30" x2="225" y2="30" stroke="white" stroke-width="0.5"/>
  
  <text x="260" y="27" fill="white" font-family="Arial Narrow" font-size="9" text-anchor="middle">CLOSE</text>
  <line x1="248" y1="30" x2="272" y2="30" stroke="white" stroke-width="0.5"/>

  <!-- Lock Section -->
  <text x="20" y="65" fill="#666666" font-family="Arial Narrow" font-size="10">STATUS</text>
  <text x="20" y="85" fill="white" font-family="Arial Narrow" font-size="10">[X] UNLOCKED</text>
  <text x="110" y="85" fill="#444444" font-family="Arial Narrow" font-size="10">[ ] LOCKED</text>
  
  <!-- Stats -->
  <text x="20" y="125" fill="#666666" font-family="Arial Narrow" font-size="10">PLAYER STATS</text>
  <rect x="20" y="135" width="260" height="40" stroke="#333333"/>
  <text x="60" y="160" fill="#00FF00" font-family="Arial Narrow" font-size="9" text-anchor="middle">HEALTH</text>
  <text x="150" y="160" fill="#FF0000" font-family="Arial Narrow" font-size="9" text-anchor="middle">RESOURCE</text>
  <text x="240" y="160" fill="#FF8000" font-family="Arial Narrow" font-size="9" text-anchor="middle">POWER</text>
</svg>
