<svg width="300" height="360" viewBox="0 0 300 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="360" fill="#050505"/>
  <rect x="0.5" y="0.5" width="299" height="359" stroke="#222222"/>
  
  <text x="16" y="28" fill="white" font-family="Arial Narrow" font-size="16" font-weight="bold">MACUI</text>
  
  <!-- Top Right Buttons -->
  <rect x="180" y="14" width="50" height="18" stroke="white" stroke-width="1"/>
  <text x="205" y="27" fill="white" font-family="Arial Narrow" font-size="9" text-anchor="middle">RELOAD</text>
  
  <rect x="238" y="14" width="46" height="18" stroke="white" stroke-width="1"/>
  <text x="261" y="27" fill="white" font-family="Arial Narrow" font-size="9" text-anchor="middle">CLOSE</text>

  <!-- Lock Toggle -->
  <text x="20" y="65" fill="#666666" font-family="Arial Narrow" font-size="10">INTERFACE LOCK</text>
  <rect x="20" y="75" width="80" height="20" fill="white"/>
  <text x="60" y="89" fill="black" font-family="Arial Narrow" font-size="10" text-anchor="middle">UNLOCKED</text>
  <rect x="105" y="75" width="80" height="20" stroke="#444444"/>
  <text x="145" y="89" fill="#444444" font-family="Arial Narrow" font-size="10" text-anchor="middle">LOCKED</text>
  
  <!-- Stats -->
  <text x="20" y="125" fill="#666666" font-family="Arial Narrow" font-size="10">PLAYER STATS</text>
  <rect x="20" y="135" width="80" height="40" stroke="#00FF00"/>
  <text x="60" y="155" fill="#00FF00" font-family="Arial Narrow" font-size="9" text-anchor="middle">HEALTH</text>
  <rect x="110" y="135" width="80" height="40" stroke="#FF0000"/>
  <text x="150" y="155" fill="#FF0000" font-family="Arial Narrow" font-size="9" text-anchor="middle">RESOURCE</text>
  <rect x="200" y="135" width="80" height="40" stroke="#FF8000"/>
  <text x="240" y="155" fill="#FF8000" font-family="Arial Narrow" font-size="9" text-anchor="middle">POWER</text>
  
  <!-- Ability Section -->
  <text x="20" y="205" fill="#666666" font-family="Arial Narrow" font-size="10">ABILITY TRACKING</text>
  <rect x="20" y="215" width="12" height="12" stroke="white"/>
  <text x="40" y="225" fill="white" font-family="Arial Narrow" font-size="10">Shield Block</text>
</svg>
