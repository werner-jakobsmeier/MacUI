<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
    <!-- Background Space -->
    <rect width="100%" height="100%" fill="#111827" />
    
    <!-- Config Window (Current 300x360 -> expanding height slightly here just so it fits the boxes visually) -->
    <rect x="150" y="50" width="300" height="480" fill="#0F172A" stroke="#D1D5DB" stroke-width="2" />
    
    <!-- Title -->
    <text x="170" y="90" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#D1D5DB">Mac</text>
    <text x="225" y="90" font-family="Arial, sans-serif" font-weight="normal" font-size="18" fill="#6B7280">UI</text>
    
    <!-- Top Right Buttons -->
    <rect x="284" y="76" width="58" height="18" fill="none" stroke="#D1D5DB" stroke-width="1" />
    <text x="313" y="89" font-family="Arial, sans-serif" font-size="8" fill="#D1D5DB" text-anchor="middle">LOCK</text>
    
    <rect x="344" y="76" width="45" height="18" fill="none" stroke="#D1D5DB" stroke-width="1" />
    <text x="366" y="89" font-family="Arial, sans-serif" font-size="8" fill="#D1D5DB" text-anchor="middle">RLD</text>
    
    <rect x="391" y="76" width="45" height="18" fill="none" stroke="#D1D5DB" stroke-width="1" />
    <text x="413" y="89" font-family="Arial, sans-serif" font-size="8" fill="#D1D5DB" text-anchor="middle">CLS</text>
    
    <!-- Intro Text (Current: 9pt, Slate) -->
    <foreignObject x="170" y="110" width="260" height="50">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Arial, sans-serif; font-size: 9px; color: #6B7280;">
            Minimalist combat tracking for critical player stats, resources, and active defensive abilities. Health and mana percentages are restricted by Blizzard security policy.
        </div>
    </foreignObject>
    
    <!-- Current Sub-Header Style (Small, dark grey, no line) -->
    <text x="170" y="170" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">ACTIVE MITIGATION</text>
    
    <!-- Mitigation Toggle 1 (Current Rows: 260x36) -->
    <rect x="170" y="180" width="260" height="36" fill="#1E293B" stroke="#94A3B8" stroke-width="1" />
    <rect x="178" y="186" width="24" height="24" fill="#EAB308" />
    <text x="206" y="198" font-family="Arial, sans-serif" font-size="12" fill="#FFF">Shield of the Righteous</text>
    <text x="206" y="210" font-family="Arial, sans-serif" font-size="9" fill="#64748B">SOUND: None</text>
    <rect x="375" y="188" width="45" height="20" fill="#22C55E" opacity="0.3" stroke="#22C55E" />
    <text x="397" y="202" font-family="Arial, sans-serif" font-size="8" fill="#FFF" text-anchor="middle">AUDIO</text>
    
    <!-- Defensive Cooldowns Header -->
    <text x="170" y="240" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">DEFENSIVE COOLDOWNS</text>
    
    <!-- Cooldown Toggle 1 -->
    <rect x="170" y="250" width="260" height="36" fill="#1E293B" stroke="#94A3B8" stroke-width="1" />
    <rect x="178" y="256" width="24" height="24" fill="#3B82F6" />
    <text x="206" y="268" font-family="Arial, sans-serif" font-size="12" fill="#FFF">Guardian of Ancient Kings</text>
    <text x="206" y="280" font-family="Arial, sans-serif" font-size="9" fill="#64748B">SOUND: ID 12345</text>
    <rect x="375" y="258" width="45" height="20" fill="#22C55E" opacity="0.3" stroke="#22C55E" />
    <text x="397" y="272" font-family="Arial, sans-serif" font-size="8" fill="#FFF" text-anchor="middle">AUDIO</text>
    
</svg>
