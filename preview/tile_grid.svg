<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="580" stroke="#D1D5DB" stroke-width="2"/>
  
  <!-- Header -->
  <text x="30" y="50" fill="#D1D5DB" font-family="Arial" font-size="24" font-weight="bold">MacUI</text>
  <text x="30" y="75" fill="#64748B" font-family="Arial" font-size="12">BRUTALIST TILE DASHBOARD</text>
  
  <!-- Large Hero Tiles -->
  <!-- Tile 1: Health -->
  <rect x="25" y="100" width="170" height="120" fill="#1E293B" stroke="#22C55E" stroke-width="3"/>
  <text x="40" y="130" fill="#22C55E" font-family="Arial" font-size="10" font-weight="bold">HEALTH</text>
  <text x="40" y="180" fill="#D1D5DB" font-family="Arial" font-size="36" font-weight="bold">537K</text>
  
  <!-- Tile 2: Shield Block (Critical) -->
  <rect x="205" y="100" width="170" height="120" fill="#1E293B" stroke="#FACC15" stroke-width="3"/>
  <text x="220" y="130" fill="#FACC15" font-family="Arial" font-size="10" font-weight="bold">SHIELD BLOCK</text>
  <text x="220" y="180" fill="#D1D5DB" font-family="Arial" font-size="36" font-weight="bold">12.0s</text>
  <rect x="205" y="210" width="140" height="10" fill="#FACC15" opacity="0.3"/> <!-- Mini progress -->
  
  <!-- Small Accessory Tiles -->
  <rect x="25" y="235" width="80" height="80" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="35" y="255" fill="#3B82F6" font-family="Arial" font-size="8" font-weight="bold">MANA</text>
  <text x="35" y="290" fill="#D1D5DB" font-family="Arial" font-size="18" font-weight="bold">100%</text>
  
  <rect x="115" y="235" width="80" height="80" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="125" y="255" fill="#F59E0B" font-family="Arial" font-size="8" font-weight="bold">CONSEC.</text>
  <text x="125" y="290" fill="#D1D5DB" font-family="Arial" font-size="18" font-weight="bold">8.5s</text>
  
  <!-- Grid layout continues... -->
  <rect x="205" y="235" width="170" height="80" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="220" y="255" fill="#334155" font-family="Arial" font-size="8" font-weight="bold">LOGS / DATA</text>
  <text x="220" y="285" fill="#334155" font-family="Arial" font-size="10">COMBAT_LOG_EVENT: SUCCESS</text>
  
  <!-- Drag Handle Indicator -->
  <circle cx="200" cy="560" r="15" fill="#D1D5DB"/>
  <text x="188" y="565" fill="#0F172A" font-family="Arial" font-size="10" font-weight="bold">DRAG</text>
</svg>
