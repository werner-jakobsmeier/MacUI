<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#0F172A"/>
  <rect x="10" y="10" width="380" height="580" stroke="#D1D5DB" stroke-width="2"/>
  
  <!-- Header -->
  <text x="30" y="50" fill="#D1D5DB" font-family="Arial" font-size="24" font-weight="bold">MacUI</text>
  <text x="30" y="75" fill="#64748B" font-family="Arial" font-size="12">MODULAR HUD CANVAS</text>
  
  <!-- Canvas Area -->
  <rect x="30" y="100" width="340" height="300" fill="#0F172A" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="140" y="260" fill="#334155" font-family="Arial" font-size="10">COMBAT CANVAS AREA</text>
  
  <!-- Floating Health -->
  <rect x="50" y="130" width="100" height="30" fill="#1E293B" stroke="#22C55E" stroke-width="1"/>
  <text x="60" y="150" fill="#22C55E" font-family="Arial" font-size="12" font-weight="bold">84% HP</text>
  
  <!-- Floating Mana -->
  <rect x="50" y="170" width="100" height="30" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="60" y="190" fill="#3B82F6" font-family="Arial" font-size="12" font-weight="bold">60% MP</text>
  
  <!-- Floating Mechanic: Shield Block -->
  <rect x="250" y="150" width="60" height="60" fill="#1E293B" stroke="#FACC15" stroke-width="2"/>
  <text x="260" y="185" fill="#FACC15" font-family="Arial" font-size="18" font-weight="bold">12.0</text>
  <text x="260" y="200" fill="#94A3B8" font-family="Arial" font-size="8">S. BLOCK</text>
  
  <!-- Controls Section -->
  <rect x="30" y="420" width="340" height="150" fill="#1E293B" stroke="#D1D5DB" stroke-width="1"/>
  <text x="45" y="445" fill="#D1D5DB" font-family="Arial" font-size="12" font-weight="bold">HUD ELEMENT CONTROLS</text>
  <text x="45" y="470" fill="#94A3B8" font-family="Arial" font-size="10">SELECTED: SHIELD BLOCK</text>
  <!-- Slider Mockup -->
  <rect x="45" y="490" width="310" height="2" fill="#334155"/>
  <circle cx="150" cy="491" r="6" fill="#D1D5DB"/>
  <text x="45" y="515" fill="#64748B" font-family="Arial" font-size="10">SCALE: 120%</text>
  <text x="45" y="540" fill="#64748B" font-family="Arial" font-size="10">OPACITY: 100%</text>
</svg>
