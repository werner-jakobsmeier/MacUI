<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Background (game world simulation) -->
  <rect width="900" height="500" fill="#1a1a2e"/>
  <text x="450" y="480" font-size="10" fill="#333344" text-anchor="middle">— Game World —</text>

  <!-- ═══════════════════════════════════ -->
  <!-- Config Panel (left side) -->
  <!-- ═══════════════════════════════════ -->
  <g transform="translate(20, 60)">
    <rect width="240" height="300" fill="#0a0a0a" opacity="0.97"/>
    <text x="14" y="28" font-size="18" font-weight="700" fill="#ffffff">MAC</text>
    <text x="56" y="28" font-size="18" font-weight="400" fill="#aaaaaa">UI</text>
    <text x="220" y="24" font-size="14" fill="#ffffff" text-anchor="middle">×</text>
    <!-- Buttons -->
    <rect x="14" y="42" width="100" height="26" rx="2" fill="#ffffff"/>
    <text x="64" y="59" font-size="10" font-weight="600" fill="#000000" text-anchor="middle">UNLOCK</text>
    <rect x="126" y="42" width="100" height="26" rx="2" fill="#ffffff"/>
    <text x="176" y="59" font-size="10" font-weight="600" fill="#000000" text-anchor="middle">LOCK</text>
    <!-- Font Size -->
    <text x="14" y="88" font-size="9" fill="#888888">FONT SIZE: 16</text>
    <rect x="14" y="94" width="210" height="2" fill="#444444"/>
    <circle cx="120" cy="95" r="4" fill="#ffffff"/>
    <!-- Abilities -->
    <text x="14" y="118" font-size="9" fill="#888888">ABILITIES</text>
    <rect x="14" y="123" width="210" height="1" fill="#333333"/>
    <!-- Row 1 -->
    <rect x="14" y="132" width="12" height="12" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
    <text x="20" y="142" font-size="9" font-weight="700" fill="#000000">✓</text>
    <rect x="30" y="132" width="14" height="14" rx="2" fill="#4488cc"/>
    <text x="50" y="143" font-size="10" fill="#ffffff">Shield Block</text>
    <!-- Row 2 -->
    <rect x="14" y="154" width="12" height="12" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
    <text x="20" y="164" font-size="9" font-weight="700" fill="#000000">✓</text>
    <rect x="30" y="154" width="14" height="14" rx="2" fill="#cc8844"/>
    <text x="50" y="165" font-size="10" fill="#ffffff">Ignore Pain</text>
    <!-- Input -->
    <rect x="18" y="182" width="140" height="18" fill="none" stroke="#555555" stroke-width="1"/>
    <text x="24" y="194" font-size="9" fill="#666666" font-style="italic">Shift-Click spell...</text>
    <rect x="164" y="182" width="18" height="18" fill="#222222" stroke="#555555" stroke-width="1"/>
    <text x="173" y="196" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">+</text>
  </g>

  <!-- ═══════════════════════════════════ -->
  <!-- Player Health (freely positioned — top center) -->
  <!-- ═══════════════════════════════════ -->
  <g transform="translate(380, 30)">
    <text x="0" y="16" font-size="16" font-weight="600" fill="#00ff00">Health: 87%</text>
    <!-- Label -->
    <text x="0" y="30" font-size="8" fill="#333344">MacUIPlayerHealth</text>
  </g>

  <!-- ═══════════════════════════════════ -->
  <!-- Warrior Texts (freely positioned — scattered) -->
  <!-- ═══════════════════════════════════ -->
  <!-- Rage (top right area) -->
  <g transform="translate(650, 50)">
    <text x="0" y="16" font-size="16" font-weight="600" fill="#ff0000">Rage: 72</text>
    <text x="0" y="30" font-size="8" fill="#333344">MacUIWarriorRage</text>
  </g>

  <!-- Ignore Pain (right side, below rage) -->
  <g transform="translate(620, 120)">
    <text x="0" y="16" font-size="16" font-weight="600" fill="#ff8800">Ignore Pain: 145.2k</text>
    <text x="0" y="30" font-size="8" fill="#333344">MacUIWarriorIgnorePain</text>
  </g>

  <!-- SB Charges (center-right) -->
  <g transform="translate(680, 200)">
    <text x="0" y="16" font-size="16" font-weight="600" fill="#88aaff">SB Charges: 2</text>
    <text x="0" y="30" font-size="8" fill="#333344">MacUIWarriorSBCharges</text>
  </g>

  <!-- SB Buff (below charges) -->
  <g transform="translate(660, 260)">
    <text x="0" y="16" font-size="16" font-weight="600" fill="#88aaff">SB Buff: 4.2s</text>
    <text x="0" y="30" font-size="8" fill="#333344">MacUIWarriorSBBuff</text>
  </g>

  <!-- ═══════════════════════════════════ -->
  <!-- Square (Warrior shield block indicator) -->
  <!-- ═══════════════════════════════════ -->
  <g transform="translate(430, 180)">
    <rect width="44" height="44" fill="#000000" stroke="#ffffff" stroke-width="4"/>
    <text x="22" y="62" font-size="8" fill="#333344" text-anchor="middle">MacUISquare</text>
  </g>

  <!-- ═══════════════════════════════════ -->
  <!-- Ability Icons (freely positioned — scattered around screen) -->
  <!-- ═══════════════════════════════════ -->

  <!-- Icon 1: Shield Block (green border — active) -->
  <g transform="translate(350, 340)">
    <rect x="-2" y="-2" width="32" height="32" rx="0" fill="none" stroke="#00ff00" stroke-width="2"/>
    <rect width="28" height="28" rx="0" fill="#4488cc"/>
    <text x="14" y="44" font-size="8" fill="#333344" text-anchor="middle">MacUIIndicator_2565</text>
  </g>

  <!-- Icon 2: Ignore Pain (red border — missing in combat) -->
  <g transform="translate(500, 380)">
    <rect x="-2" y="-2" width="32" height="32" rx="0" fill="none" stroke="#ff0000" stroke-width="2"/>
    <rect width="28" height="28" rx="0" fill="#665533" opacity="0.6"/>
    <text x="14" y="44" font-size="8" fill="#333344" text-anchor="middle">MacUIIndicator_190456</text>
  </g>

  <!-- Icon 3: Last Stand (gray border — out of combat) -->
  <g transform="translate(420, 420)">
    <rect x="-2" y="-2" width="32" height="32" rx="0" fill="none" stroke="#888888" stroke-width="2"/>
    <rect width="28" height="28" rx="0" fill="#cc4444" opacity="0.8"/>
    <text x="14" y="44" font-size="8" fill="#333344" text-anchor="middle">MacUIIndicator_12975</text>
  </g>

  <!-- ═══════════════════════════════════ -->
  <!-- Minimap (top right corner) -->
  <!-- ═══════════════════════════════════ -->
  <g transform="translate(800, 20)">
    <circle cx="40" cy="40" r="40" fill="#2a3a2a" stroke="#665533" stroke-width="3"/>
    <text x="40" y="44" font-size="9" fill="#557755" text-anchor="middle">Minimap</text>
    <!-- Minimap Button -->
    <circle cx="72" cy="12" r="10" fill="#444444" stroke="#665533" stroke-width="2"/>
    <text x="72" y="16" font-size="8" fill="#cccccc" text-anchor="middle">M</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 440)">
    <text x="0" y="0" font-size="9" fill="#555566">Each element is independently draggable — positions saved per-frame to MacUIDB.positions</text>
    <text x="0" y="14" font-size="9" fill="#555566">Green labels = frame names used as position keys</text>
  </g>
</svg>
