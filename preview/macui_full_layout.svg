<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <!-- Dark game background -->
  <rect width="900" height="500" fill="#111111"/>
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="11" fill="#444444" text-anchor="middle">— MacUI Full Layout Preview (Icon-Based) —</text>

  <!-- ========================================== -->
  <!-- BLACK SQUARE (combat warning) -->
  <!-- ========================================== -->
  <rect x="110" y="140" width="40" height="40" fill="#000000" stroke="#FFFFFF" stroke-width="4"/>

  <!-- ========================================== -->
  <!-- PLAYER HEALTH -->
  <!-- ========================================== -->
  <text x="400" y="280" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#00FF00" text-anchor="middle">Health: 87%</text>

  <!-- ========================================== -->
  <!-- WARRIOR TRACKER -->
  <!-- ========================================== -->
  <text x="400" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FF0000" text-anchor="middle">Rage: 62</text>
  <text x="400" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FF8000" text-anchor="middle">Ignore Pain: 245.3k</text>
  <text x="400" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#88AAFF" text-anchor="middle">SB Charges: 1</text>
  <text x="400" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#88AAFF" text-anchor="middle">SB Buff: 3.2s</text>

  <!-- ========================================== -->
  <!-- ABILITY TRACKER — ICON BASED (right side) -->
  <!-- ========================================== -->

  <!-- Shield Block icon — GREEN border (active) -->
  <rect x="628" y="178" width="32" height="32" fill="#1a3a6a" rx="2"/>
  <rect x="626" y="176" width="36" height="36" fill="none" stroke="#00FF00" stroke-width="2" rx="2"/>
  <text x="644" y="200" font-family="Arial Black, sans-serif" font-size="10" fill="#6699CC" text-anchor="middle">SB</text>

  <!-- Ignore Pain icon — RED border (missing in combat) -->
  <rect x="628" y="218" width="32" height="32" fill="#3a2a1a" rx="2" opacity="0.6"/>
  <rect x="626" y="216" width="36" height="36" fill="none" stroke="#FF0000" stroke-width="2" rx="2"/>
  <text x="644" y="238" font-family="Arial Black, sans-serif" font-size="10" fill="#996633" text-anchor="middle" opacity="0.6">IP</text>

  <!-- Spell Reflect icon — GRAY border (out of combat) -->
  <rect x="628" y="258" width="32" height="32" fill="#2a2a4a" rx="2" opacity="0.8"/>
  <rect x="626" y="256" width="36" height="36" fill="none" stroke="#808080" stroke-width="2" rx="2"/>
  <text x="644" y="278" font-family="Arial Black, sans-serif" font-size="10" fill="#6666AA" text-anchor="middle" opacity="0.8">SR</text>

  <text x="644" y="306" font-family="Arial, sans-serif" font-size="8" fill="#555555" text-anchor="middle">Ability Icons</text>

  <!-- ========================================== -->
  <!-- CONFIG PANEL (brutalist V2 + abilities) -->
  <!-- ========================================== -->
  <rect x="30" y="40" width="260" height="360" fill="#0a0a0a" rx="0"/>

  <!-- Title -->
  <text x="46" y="72" font-family="Arial Black, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">MAC</text>
  <text x="112" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="300" fill="#AAAAAA">UI</text>
  <text x="267" y="68" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">×</text>

  <!-- Buttons -->
  <rect x="50" y="90" width="105" height="32" fill="#FFFFFF" rx="0"/>
  <text x="102" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">UNLOCK</text>
  <rect x="165" y="90" width="105" height="32" fill="#FFFFFF" rx="0"/>
  <text x="217" y="111" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">LOCK</text>

  <!-- Font size section -->
  <text x="50" y="153" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888888" letter-spacing="1">FONT SIZE</text>
  <text x="160" y="195" font-family="Arial Black, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">14</text>
  <rect x="50" y="210" width="220" height="2" fill="#666666" rx="1"/>
  <rect x="112" y="204" width="12" height="12" fill="#FFFFFF" rx="0"/>
  <text x="50" y="232" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#666666">8</text>
  <text x="265" y="232" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#666666" text-anchor="end">32</text>

  <!-- ABILITIES section -->
  <text x="50" y="260" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#888888" letter-spacing="1">ABILITIES</text>
  <rect x="50" y="268" width="220" height="1" fill="#333333"/>

  <!-- Row 1: Shield Block (checked) — with icon -->
  <rect x="50" y="280" width="14" height="14" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
  <text x="57" y="291" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">✓</text>
  <rect x="72" y="279" width="16" height="16" fill="#1a3a6a" rx="1"/>
  <text x="80" y="291" font-family="Arial Black, sans-serif" font-size="7" fill="#6699CC" text-anchor="middle">SB</text>
  <text x="96" y="291" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Shield Block</text>

  <!-- Row 2: Spell Reflect (unchecked) — with icon -->
  <rect x="50" y="304" width="14" height="14" fill="#262626" stroke="#808080" stroke-width="1"/>
  <rect x="72" y="303" width="16" height="16" fill="#2a2a4a" rx="1"/>
  <text x="80" y="315" font-family="Arial Black, sans-serif" font-size="7" fill="#6666AA" text-anchor="middle">SR</text>
  <text x="96" y="315" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Spell Reflect</text>

  <!-- Row 3: Ignore Pain (checked) — with icon -->
  <rect x="50" y="328" width="14" height="14" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
  <text x="57" y="339" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">✓</text>
  <rect x="72" y="327" width="16" height="16" fill="#3a2a1a" rx="1"/>
  <text x="80" y="339" font-family="Arial Black, sans-serif" font-size="7" fill="#996633" text-anchor="middle">IP</text>
  <text x="96" y="339" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Ignore Pain</text>

  <!-- ========================================== -->
  <!-- LABELS -->
  <!-- ========================================== -->
  <text x="160" y="420" font-family="Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Config Panel (/macui)</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Player Health + Warrior Tracker</text>
  <text x="130" y="195" font-family="Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">Combat Square</text>
</svg>
